name: Live Integration Tests

# Deliberately NOT triggered on every push/PR (Infrastructure Design) - an external
# government/API/database outage is not application correctness and must never block an
# otherwise-correct deploy. Run manually, on a schedule, or when specifically touching an
# adapter/integration.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1" # weekly, Monday 13:00 UTC - arbitrary low-traffic cadence, adjustable

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Live integration tests
        run: npm run test:integration
        env:
          # King County GIS and Legistar need no credentials (public APIs) and always run.
          # DATABASE_URL/ANTHROPIC_API_KEY are optional repo secrets - when absent, the
          # corresponding suites skip cleanly rather than failing (see each *.integration.test.ts
          # file's own describe.skipIf).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
